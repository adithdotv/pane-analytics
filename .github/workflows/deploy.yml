name: Test and Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: pane_analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: receiver
        run: pip install -r requirements.txt

      - name: Create test tables
        env:
          PGPASSWORD: testpassword
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d pane_analytics_test -c "
            CREATE TABLE users (
              id SERIAL PRIMARY KEY,
              email TEXT NOT NULL UNIQUE,
              hashed_password TEXT NOT NULL,
              created_at TIMESTAMP DEFAULT NOW()
            );

            CREATE TABLE sites (
              id SERIAL PRIMARY KEY,
              user_id INTEGER NOT NULL REFERENCES users(id),
              name TEXT NOT NULL,
              site_key TEXT NOT NULL UNIQUE,
              created_at TIMESTAMP DEFAULT NOW()
            );

            CREATE TABLE pageviews (
              id SERIAL PRIMARY KEY,
              url TEXT NOT NULL,
              referrer TEXT,
              country TEXT,
              device_type TEXT,
              created_at TIMESTAMP DEFAULT NOW(),
              site_id INTEGER REFERENCES sites(id)
            );
          "

      - name: Run tests
        working-directory: receiver
        env:
          DB_NAME: pane_analytics_test
          DB_USER: postgres
          DB_PASSWORD: testpassword
          DB_HOST: localhost
          DB_PORT: 5432
        run: pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/pane-analytics
            git pull origin main

            cd receiver
            source venv/bin/activate
            pip install -r requirements.txt
            deactivate

            cd ../dashboard
            npm install
            npm run build

            sudo systemctl restart pane-receiver pane-worker pane-dashboard